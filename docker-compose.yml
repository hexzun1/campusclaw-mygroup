# 正式交付：只暴露 web 端口，db、api 与 qdrant 均不映射到宿主机。
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 向量库。不写 ports：浏览器与宿主机都不直连，只有 api 经服务名访问
  # （design.md Decision 3 与 Decision 10）。depends_on 只用 service_started，
  # 因为 qdrant 起得比 api 慢、也可能整体不可用，而 api 在这种情况下仍须能启动。
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  # 自建 MCP 示例服务器。令牌只在运行时注入，镜像层不含任何令牌。
  mcp-demo:
    build:
      context: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QDRANT_URL: http://qdrant:6333
      # 只有 web 容器所在的那一个地址可以覆盖客户端 IP；其他容器与宿主机
      # 均按自己的 RemoteAddr 计数（design.md D2）。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.31.240.10/32}
    volumes:
      - uploaddata:${UPLOAD_DIR}
    networks:
      - default
      - edge
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    # web 只接入 edge：它对 api 的请求因此必然从下面这个固定地址发出，
    # 可信代理列表才能收窄到单个地址而不是整个网段。
    networks:
      edge:
        ipv4_address: 172.31.240.10
    depends_on:
      - api
    restart: unless-stopped

networks:
  # 只承载 web → api 的入口流量。同网段的其他工作负载不因此获得伪造
  # X-Real-IP 的能力；若与宿主机已有网段冲突，改这里与 api 的
  # TRUSTED_PROXY_CIDRS 两处即可。
  edge:
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  dbdata:
  uploaddata:
  qdrantdata:
