# 正式交付：只暴露 web 端口，db、api 与 qdrant 均不映射到宿主机。
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 向量库。不写 ports：浏览器与宿主机都不直连，只有 api 经服务名访问
  # （design.md Decision 3 与 Decision 10）。depends_on 只用 service_started，
  # 因为 qdrant 起得比 api 慢、也可能整体不可用，而 api 在这种情况下仍须能启动。
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QDRANT_URL: http://qdrant:6333
    volumes:
      - uploaddata:${UPLOAD_DIR}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
  uploaddata:
  qdrantdata:
