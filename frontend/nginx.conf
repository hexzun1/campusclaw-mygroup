server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bearer token is readable by page scripts, so script injection is the
    # main residual risk: scripts and connections are limited to this origin and
    # inline/eval are forbidden (design.md Decision 4). Declared once at server
    # level - an add_header inside a location would stop that location from
    # inheriting this one, so child locations MUST NOT declare their own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Streaming ask endpoint (design.md Decision 8): buffering and caching off
    # so every event reaches the browser as it is produced, HTTP/1.1 with a
    # cleared Connection header for chunked proxying, and a read timeout that
    # outlasts a long answer. No add_header here: the location must keep
    # inheriting the server-level CSP.
    location ~ ^/api/conversations/[0-9]+/stream$ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
    }

    # API documentation (design.md Decision 9): the page is served by the api
    # service. No add_header here: the location must keep inheriting the
    # server-level CSP, which the self-hosted page satisfies (no inline
    # scripts, no inline styles).
    location /swagger/ {
        proxy_pass http://api:8081/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenAPI 3.0 document (design.md Decision 9): an exact match so no other
    # prefix can shadow it. No add_header here either: the location must keep
    # inheriting the server-level CSP.
    location = /openapi.json {
        proxy_pass http://api:8081/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8081/health;
    }

    # Single-page app: any other path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
