server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bearer token is readable by page scripts, so script injection is the
    # main residual risk: scripts and connections are limited to this origin and
    # inline/eval are forbidden (design.md Decision 4). Declared once at server
    # level - an add_header inside a location would stop that location from
    # inheriting this one, so child locations MUST NOT declare their own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8081/health;
    }

    # Single-page app: any other path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
